<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Équipe — B10 Architecture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Barlow:wght@300;400;500&family=Barlow+Condensed:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared.css">
<style>
.member-layout{display:grid;grid-template-columns:400px 1fr;gap:0;min-height:calc(100vh - 72px);margin-top:72px;}
.member-photo{position:sticky;top:72px;height:calc(100vh - 72px);overflow:hidden;background:var(--surface);}
.member-photo img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block;}
.member-content{padding:80px 64px;}
.member-contact-links{display:flex;gap:16px;margin-top:32px;flex-wrap:wrap;}
.team-grid-mini{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;}
.team-mini-card{position:relative;overflow:hidden;aspect-ratio:1/1;text-decoration:none;display:block;background:var(--surface);}
.team-mini-card img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block;transition:transform 0.5s ease;}
.team-mini-card:hover img{transform:scale(1.05);}
.team-mini-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(13,13,13,0.9),transparent 55%);display:flex;flex-direction:column;justify-content:flex-end;padding:14px;}
.team-mini-name{font-family:var(--font-display);font-size:16px;font-weight:400;color:var(--white);}
.team-mini-role{font-family:var(--font-label);font-size:9px;font-weight:500;letter-spacing:0.12em;text-transform:uppercase;color:var(--gold);margin-top:2px;}
.team-mini-line{position:absolute;bottom:0;left:0;right:0;height:2px;background:var(--gold);transform:scaleX(0);transform-origin:left;transition:transform 0.4s ease;}
.team-mini-card:hover .team-mini-line{transform:scaleX(1);}
@media(max-width:900px){.member-layout{grid-template-columns:1fr;}.member-photo{position:relative;height:60vw;min-height:300px;max-height:480px;}.member-content{padding:40px 20px;}.team-grid-mini{grid-template-columns:1fr 1fr;}}
</style>
</head>
<body>
<div id="cursor"></div><div id="cursor-ring"></div>
<nav id="navbar">
  <a href="../index.html" class="nav-logo"><span class="nav-logo-text"><span class="gold">B</span>10 Architecture &amp; Design</span></a>
  <ul class="nav-links" id="navLinks">
    <li><a href="../index.html#bureau">Bureau</a></li>
    <li><a href="../index.html#projets">Projets</a></li>
    <li><a href="../index.html#equipe" class="active">Équipe</a></li>
    <li><a href="../index.html#contact" class="nav-cta">Contact</a></li>
  </ul>
  <button class="nav-toggle" id="navToggle"><span></span><span></span><span></span></button>
</nav>
<div class="member-layout">
  <div class="member-photo"><img id="mPhoto" src="" alt="" loading="eager" onerror="this.style.background='linear-gradient(135deg,#1a1a0e,#2d2510)';this.removeAttribute('src')"></div>
  <div class="member-content">
    <a href="../index.html#equipe" class="back-link">L'équipe</a>
    <div class="page-subtitle" id="mRole" style="margin-bottom:12px;"></div>
    <h1 class="page-title" id="mName" style="font-size:clamp(40px,5vw,64px);">Chargement…</h1>
    <div style="width:40px;height:1px;background:var(--gold);margin:24px 0;"></div>
    <p id="mBio" style="font-size:16px;font-weight:300;color:rgba(242,240,235,0.65);line-height:1.85;max-width:520px;"></p>
    <div class="member-contact-links" id="mLinks"></div>
  </div>
</div>
<div class="section" style="background:var(--dark);border-top:1px solid var(--border);">
  <div class="section-label">L'équipe</div>
  <h2 class="section-title">Rencontrez notre équipe</h2>
  <div class="team-grid-mini sr-stagger" id="mOthers"></div>
</div>
<footer>
  <span class="footer-copy">© 2026 B10 Architecture &amp; Design</span>
  <ul class="footer-links"><li><a href="#">RGPD</a></li><li><a href="#">Vie privée</a></li></ul>
  <div class="footer-social"><a href="#">FB</a><a href="#">IG</a><a href="#">LI</a></div>
</footer>

<script>
// Interactions communes (curseur, menu, apparition)
const cursor=document.getElementById('cursor'),ring=document.getElementById('cursor-ring');
let cx=0,cy=0,rx=0,ry=0;
document.addEventListener('mousemove',e=>{cx=e.clientX;cy=e.clientY;cursor.style.left=cx+'px';cursor.style.top=cy+'px';});
function animRing(){rx+=(cx-rx)*0.12;ry+=(cy-ry)*0.12;ring.style.left=rx+'px';ring.style.top=ry+'px';requestAnimationFrame(animRing);}
animRing();
function bindHover(){document.querySelectorAll('a,button').forEach(el=>{el.addEventListener('mouseenter',()=>document.body.classList.add('cursor-hover'));el.addEventListener('mouseleave',()=>document.body.classList.remove('cursor-hover'));});}
bindHover();
const toggle=document.getElementById('navToggle'),nav=document.getElementById('navLinks');
toggle.addEventListener('click',()=>{nav.classList.toggle('open');const s=toggle.querySelectorAll('span');if(nav.classList.contains('open')){s[0].style.transform='translateY(6px) rotate(45deg)';s[1].style.opacity='0';s[2].style.transform='translateY(-6px) rotate(-45deg)';}else{s.forEach(x=>{x.style.transform='';x.style.opacity='';})}});
nav.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>nav.classList.remove('open')));
function revealAll(){document.querySelectorAll('.sr,.sr-left,.sr-stagger').forEach(el=>el.classList.add('visible'));}
setTimeout(revealAll,300);
</script>

<script>
// Chargement dynamique du membre depuis le CMS (content/equipe/{slug}.md)
(function(){
  const API='https://api.github.com/repos/francoisarca1406/b10-architecture/contents/content/equipe';
  const RAW='https://raw.githubusercontent.com/francoisarca1406/b10-architecture/main/content/equipe/';
  const slug=new URLSearchParams(location.search).get('slug');

  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}

  function parseFrontmatter(text){
    const m=text.match(/^---\r?\n([\s\S]*?)\r?\n---/);
    if(!m) return null;
    const data={};
    m[1].split(/\r?\n/).forEach(line=>{
      if(!line.trim()||line.trim().startsWith('#')) return;
      if(/^\s/.test(line)) return;
      const i=line.indexOf(':'); if(i===-1) return;
      const key=line.slice(0,i).trim(); let val=line.slice(i+1).trim();
      if(!val) return;
      if((val.startsWith('"')&&val.endsWith('"'))||(val.startsWith("'")&&val.endsWith("'"))) val=val.slice(1,-1);
      else if(val==='true') val=true; else if(val==='false') val=false;
      else if(/^-?\d+$/.test(val)) val=Number(val);
      data[key]=val;
    });
    return data;
  }

  function notFound(msg){
    document.getElementById('mName').textContent='Membre introuvable';
    document.getElementById('mRole').textContent='';
    document.getElementById('mBio').textContent=msg||"Ce membre n'existe pas ou n'est plus publié. Retournez à la page équipe.";
    document.title='Équipe — B10 Architecture';
  }

  async function loadMember(){
    if(!slug){notFound("Aucun membre spécifié.");return;}
    try{
      const r=await fetch(RAW+encodeURIComponent(slug)+'.md',{cache:'no-store'});
      if(!r.ok) throw new Error('introuvable');
      const d=parseFrontmatter(await r.text());
      if(!d||!d.nom) throw new Error('illisible');

      document.title=d.nom+' — B10 Architecture';
      const photo=document.getElementById('mPhoto');
      if(d.photo){photo.src=d.photo;photo.alt=d.nom;}
      document.getElementById('mRole').textContent=d.role||'';
      document.getElementById('mName').textContent=d.nom;
      document.getElementById('mBio').textContent=d.bio||'';

      const links=document.getElementById('mLinks');
      let html='';
      if(d.email) html+='<a href="mailto:'+esc(d.email)+'" class="btn btn-primary">Envoyer un message</a>';
      if(d.linkedin) html+='<a href="'+esc(d.linkedin)+'" target="_blank" rel="noopener" class="btn btn-outline">LinkedIn</a>';
      links.innerHTML=html;
      bindHover();
    }catch(e){ notFound(); }
  }

  async function loadOthers(){
    const grid=document.getElementById('mOthers');
    try{
      const res=await fetch(API,{headers:{'Accept':'application/vnd.github.v3+json'}});
      if(!res.ok) throw new Error();
      const files=(await res.json()).filter(f=>f.type==='file'&&(f.name.endsWith('.md')||f.name.endsWith('.json')));
      const members=(await Promise.all(files.map(async f=>{
        try{const t=await (await fetch(f.download_url)).text();
          const d=f.name.endsWith('.json')?JSON.parse(t):parseFrontmatter(t);
          if(!d||!d.nom) return null; d._file=f.name.replace(/\.(md|json)$/,''); return d;
        }catch(e){return null;}
      }))).filter(Boolean).sort((a,b)=>(a.ordre||99)-(b.ordre||99));

      const others=members.filter(m=>m._file!==slug);
      if(others.length===0){grid.parentElement.style.display='none';return;}
      grid.innerHTML=others.map(m=>
        '<a href="membre.html?slug='+encodeURIComponent(m._file)+'" class="team-mini-card">'+
          '<img src="'+esc(m.photo||'')+'" alt="'+esc(m.nom)+'" loading="eager" onerror="this.style.background=\'linear-gradient(135deg,#1a1a0e,#2d2510)\';this.removeAttribute(\'src\')">'+
          '<div class="team-mini-overlay"><div class="team-mini-name">'+esc(m.nom)+'</div>'+
          '<div class="team-mini-role">'+esc(m.role||'')+'</div></div>'+
          '<div class="team-mini-line"></div>'+
        '</a>'
      ).join('');
      grid.classList.add('visible');
      Array.from(grid.children).forEach(el=>{el.style.opacity='1';el.style.transform='none';});
      bindHover();
    }catch(e){ grid.parentElement.style.display='none'; }
  }

  loadMember();
  loadOthers();
})();
</script>
</body>
</html>
